<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Readout v2</title>
<!-- A: text labels read clearest but need ~260 px and do not fit a 420 px header
     beside "Listening"; B: quietest but the figures float loose by the gear; C: the
     ring and lift make it a button again. D keeps A's single flat capsule with B's
     11 px symbols and fits the worst case (both clocks past 10 h). -->
<!-- Three quieter directions for the header's usage readout (Session, Today, Cost).
     Static renders: render.sh screenshots each variant at 430 px, light and dark.
     ?v=a|b|c picks one variant, ?theme=light|dark the theme; no query shows all. -->
<style>
:root {
  color-scheme: light;
  --bg: #F4F5F7; --surface-1: #FFFFFF; --fill: rgba(0,0,0,0.045); --line: #E0E3E8;
  --hair: rgba(0,0,0,0.12);
  --fg: #0F1217; --fg-2: #434B57; --fg-3: #5B6472; --fg-4: #7C8594;
  --live: #2F7A12;
  --shadow-border: 0 0 0 1px rgba(0,0,0,0.07), 0 1px 2px -1px rgba(0,0,0,0.08), 0 2px 4px 0 rgba(0,0,0,0.03);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0D10; --surface-1: #14171C; --fill: rgba(255,255,255,0.055); --line: #252A32;
  --hair: rgba(255,255,255,0.12);
  --fg: #ECEFF4; --fg-2: #AAB2BF; --fg-3: #8B94A3; --fg-4: #6E7786;
  --live: #8BD96B;
  --shadow-border: 0 0 0 1px rgba(255,255,255,0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
.frame { width: 430px; background: var(--bg); padding: 12px 0 14px; }
.cap { padding: 0 16px 6px; font-size: 11px; color: var(--fg-3); letter-spacing: 0.01em; }
.cap b { color: var(--fg-2); font-weight: 600; }

/* The header, as the app draws it: status left, readout right, gear. */
.top { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 6px 0 16px; }
.status { display: flex; align-items: flex-start; gap: 8px; margin-right: auto; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); margin-top: 6px; }
.word { font: 600 15px/20px var(--font-ui); color: var(--live); letter-spacing: -0.01em; }
.sub { font-size: 12px; line-height: 16px; color: var(--fg-2); }
.gear { width: 36px; height: 36px; display: grid; place-items: center; color: var(--fg-2); }
.gear svg { width: 17px; height: 17px; }
.rule { height: 1px; background: var(--line); margin: 8px 16px; opacity: .7; }

.v { font-variant-numeric: tabular-nums; text-align: right; display: inline-block; }
.v.clk { width: 4.6ch; } .v.clk[data-wide] { width: 6.6ch; }
.v.cost { width: 5.3ch; }

/* ---- A: one capsule, hairlines, tiny text labels ---- */
.a { display: flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--fill); white-space: nowrap; }
.a .slot { display: flex; align-items: baseline; gap: 4px; }
.a .slot + .slot::before { content: ""; align-self: center; width: 1px; height: 12px; background: var(--hair); margin: 0 8px; }
.a .l { font-size: 11px; color: var(--fg-3); }
.a .v { font-size: 12px; font-weight: 500; color: var(--fg-2); }

/* ---- B: no container, symbols, thin gaps ---- */
.b { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.b .slot { display: flex; align-items: center; gap: 4px; }
.b svg { width: 12px; height: 12px; color: var(--fg-4); fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.b .v { font-size: 12px; font-weight: 400; color: var(--fg-2); }
.b .slot.cost .v { font-weight: 500; color: var(--fg); }

/* ---- C: capsule, symbols, hairlines ---- */
.c { display: flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 13px; box-shadow: var(--shadow-border); background: var(--surface-1); white-space: nowrap; }
.c .slot { display: flex; align-items: center; gap: 4px; }
.c .slot + .slot::before { content: ""; width: 1px; height: 12px; background: var(--hair); margin: 0 8px 0 4px; }
.c svg { width: 11px; height: 11px; color: var(--fg-4); fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.c .v { font-size: 12px; font-weight: 500; color: var(--fg-2); }

/* ---- D (chosen): A's flat capsule and hairlines, B's symbols; "$" names the cost ---- */
.d { display: flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: var(--fill); white-space: nowrap; }
.d .slot { display: flex; align-items: center; gap: 4px; }
.d .slot + .slot::before { content: ""; width: 1px; height: 12px; background: var(--hair); margin: 0 8px; }
.d svg { width: 11px; height: 11px; color: var(--fg-3); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.d .v { font-size: 12px; font-weight: 500; color: var(--fg-2); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 3h4"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"/></symbol>
  <symbol id="dollar" viewBox="0 0 24 24"><path d="M12 3.5v17M16 7.5c-.8-1.3-2.2-2-4-2-2.3 0-4 1.2-4 3s1.6 2.6 4 3.1 4 1.4 4 3.3-1.7 3.1-4 3.1c-1.9 0-3.4-.8-4.2-2.2"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.3 2.8-.6.6 2.8 2.3 1.6-1.2 2.6 1.2 2.6-2.3 1.6-.6 2.8-2.8-.6L12 21.2l-1.6-2.3-2.8.6-.6-2.8-2.3-1.6L5.9 12 4.7 9.4 7 7.8l.6-2.8 2.8.6z"/></g></symbol>
</svg>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
const states = [
  { word: "Live", sub: "dev", s: "1:35", t: "1:05:36", c: "$3.28", tw: true },
  { word: "Live", sub: "claude-live", s: "14:02", t: "31:40", c: "$1.56", tw: false },
];
const names = { a: "A · Capsule, hairlines, text labels", b: "B · No container, symbols, thin gaps", c: "C · Raised capsule, symbols, hairlines", d: "D · Chosen: flat capsule, symbols, hairlines" };
states.push({ word: "Listening", sub: "sotto", s: "10:00:00", t: "10:00:00", c: "$30.00", tw: true, sw: true });
const clk = (v, wide) => `<span class="v clk"${wide ? " data-wide" : ""}>${v}</span>`;
const readout = {
  a: (x) => `<div class="a"><span class="slot"><span class="l">Session</span>${clk(x.s)}</span><span class="slot"><span class="l">Today</span>${clk(x.t, x.tw)}</span><span class="slot"><span class="v cost">${x.c}</span></span></div>`,
  b: (x) => `<div class="b"><span class="slot"><svg><use href="#timer"/></svg>${clk(x.s)}</span><span class="slot"><svg><use href="#cal"/></svg>${clk(x.t, x.tw)}</span><span class="slot cost"><span class="v cost">${x.c}</span></span></div>`,
  d: (x) => `<div class="d"><span class="slot"><svg><use href="#timer"/></svg>${clk(x.s, x.sw)}</span><span class="slot"><svg><use href="#cal"/></svg>${clk(x.t, x.tw)}</span><span class="slot"><span class="v cost">${x.c}</span></span></div>`,
  c: (x) => `<div class="c"><span class="slot"><svg><use href="#timer"/></svg>${clk(x.s)}</span><span class="slot"><svg><use href="#cal"/></svg>${clk(x.t, x.tw)}</span><span class="slot"><svg><use href="#dollar"/></svg><span class="v cost">${x.c.slice(1)}</span></span></div>`,
};
const header = (k, x) => `<div class="top"><div class="status"><span class="dot"></span><div><div class="word">${x.word}</div><div class="sub">${x.sub}</div></div></div>${readout[k](x)}<span class="gear"><svg><use href="#gear"/></svg></span></div>`;
const pick = q.get("v") ? [q.get("v")] : ["a", "b", "c", "d"];
document.getElementById("root").innerHTML = pick.map((k) =>
  `<section class="frame"><div class="cap"><b>${names[k]}</b> · ${document.documentElement.dataset.theme || "light"}</div>${states.map((x) => header(k, x)).join('<div class="rule"></div>')}</section>`).join("");
</script>
</body>
</html>
