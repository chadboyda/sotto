<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Instrument: sotto mockups</title>
<style>
/* ==== tokens.css (inlined) ==== */
/* sotto · Direction A "Instrument" · design tokens
 *
 * Plain CSS custom properties. No build step, no web fonts (SPEC §7.1).
 * Theme follows the OS: light is the base, dark comes from
 * prefers-color-scheme. [data-theme] on any element forces a theme for that
 * subtree (used by the mockup frames and by a future manual override).
 *
 * Contrast (WCAG 2.x, measured against --bg / --surface-1 / --surface-2):
 *   text tokens   >= 4.5:1 in both themes (lowest: light --live on --surface-2, 4.62)
 *   --edge        >= 3.0:1 (control boundaries, WCAG 1.4.11)
 *   signal colors >= 4.5:1 so they can also be used as text
 */

/* ---------- Theme-independent scales ---------- */
:root {
  /* Type: system stacks only */
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  /* Type scale (px values; 1.2-ish steps, tuned for a 360-640px wide window) */
  --text-meta: 12px;     /* header meta, kbd labels; never body copy */
  --text-small: 13px;    /* secondary lines, card labels */
  --text-body: 15px;     /* body, captions history, buttons */
  --text-lead: 17px;     /* latest caption line */
  --text-state: 22px;    /* the talking-state word under the dial */
  --text-title: 24px;    /* overlay card titles (paused, errors, allow mic) */

  --leading-tight: 1.2;
  --leading-body: 1.45;
  --weight-regular: 400;
  --weight-medium: 510;
  --weight-semibold: 600;
  --tracking-title: -0.015em;
  --tracking-caps: 0.06em; /* only for the tiny instrument legends */

  /* Spacing: 4/8 grid */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --gutter: 16px;          /* window side padding */
  --gap-control: 8px;      /* between controls in one group */
  --gap-group: 16px;       /* between groups */

  /* Radii: machined, not pillowy */
  --radius-xs: 4px;        /* kbd, tags */
  --radius-sm: 8px;        /* buttons, inputs */
  --radius-md: 12px;       /* cards */
  --radius-lg: 16px;       /* drawer, overlay cards */
  --radius-round: 999px;   /* dial, mute button */

  /* Hit targets */
  --hit-min: 44px;         /* every interactive element */
  --hit-primary: 88px;     /* mute button (brief floor: 64px) */
  --dial-size: 208px;      /* the voice instrument at default size */
  --dial-size-compact: 132px;

  /* Borders */
  --stroke-hair: 1px;
  --stroke-focus: 2px;

  /* Motion: calm, signal-driven. Nothing loops while idle. */
  --dur-instant: 80ms;     /* press feedback */
  --dur-fast: 150ms;       /* hover, color changes */
  --dur-base: 200ms;       /* state changes of the dial */
  --dur-slow: 250ms;       /* drawer, overlay card */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);     /* expo-out: arrivals */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* symmetric: sweeps */
  /* Level meters: the JS applies attack/release smoothing (attack ~40ms,
     release ~220ms) to the analyser value; CSS never animates tick length. */
  --meter-attack: 40ms;
  --meter-release: 220ms;
}

/* ---------- Light (base) ---------- */
:root,
[data-theme="light"] {
  color-scheme: light;

  /* Neutrals: cool graphite, zero warmth */
  --bg: #F5F6F8;
  --surface-1: #FFFFFF;
  --surface-2: #ECEEF2;
  --surface-sunken: #E4E7EC;
  --line: #DCE0E6;          /* dividers only, never a control edge */
  --edge: #7A8391;          /* control boundaries: 3.54:1 on bg */
  --fg: #0F1217;            /* 17.35:1 */
  --fg-2: #434B57;          /* 8.15:1 */
  --fg-3: #5B6472;          /* 5.53:1, the faintest text allowed */
  --tick-rest: #B7BEC8;     /* idle meter ticks (decorative) */

  /* Signals: one color per meaning, same hue family in both themes */
  --live: #2F7A12;          /* live / heard / you speaking */
  --live-tint: #E6F2DF;
  --work: #2352C4;          /* Claude Code working */
  --work-tint: #E4EBFA;
  --attn: #8A5700;          /* needs approval, paused-with-news */
  --attn-tint: #FBF0D9;
  --attn-edge: #B07A12;
  --err: #BE2B1D;           /* errors, End voice */
  --err-tint: #FBE5E2;
  --mute: #6A3FD0;          /* muted */
  --mute-tint: #ECE5FB;
  --voice: #0F1217;         /* Sotto speaking: ink, not a hue */

  --on-signal: #FFFFFF;     /* text/icon on a filled signal color */
  --focus: #2352C4;
  --selection: #CFDCF7;
  --shadow-drawer: 0 -8px 24px rgba(15, 18, 23, 0.12), 0 -1px 0 rgba(15, 18, 23, 0.06);
  --shadow-dial: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(15, 18, 23, 0.10), 0 6px 16px rgba(15, 18, 23, 0.08);
}

/* ---------- Dark ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B0D10;
    --surface-1: #14171C;
    --surface-2: #1C2027;
    --surface-sunken: #07080A;
    --line: #252A32;
    --edge: #626C7B;          /* 3.66:1 on bg */
    --fg: #ECEFF4;            /* 16.88:1 */
    --fg-2: #AAB2BF;          /* 9.11:1 */
    --fg-3: #8B94A3;          /* 6.36:1 */
    --tick-rest: #333A45;
    --live: #8BD96B;
    --live-tint: #16241A;
    --work: #7FA8FF;
    --work-tint: #141E33;
    --attn: #F0B43C;
    --attn-tint: #2A2110;
    --attn-edge: #B8871F;
    --err: #FF7A6B;
    --err-tint: #2E1614;
    --mute: #B9A2FF;
    --mute-tint: #1F1A33;
    --voice: #ECEFF4;
    --on-signal: #0B0D10;
    --focus: #7FA8FF;
    --selection: #2A3C66;
    --shadow-drawer: 0 -8px 24px rgba(0, 0, 0, 0.5), 0 -1px 0 rgba(255, 255, 255, 0.04);
    --shadow-dial: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 0 rgba(0, 0, 0, 0.6), 0 8px 20px rgba(0, 0, 0, 0.45);
  }
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0D10;
  --surface-1: #14171C;
  --surface-2: #1C2027;
  --surface-sunken: #07080A;
  --line: #252A32;
  --edge: #626C7B;
  --fg: #ECEFF4;
  --fg-2: #AAB2BF;
  --fg-3: #8B94A3;
  --tick-rest: #333A45;
  --live: #8BD96B;
  --live-tint: #16241A;
  --work: #7FA8FF;
  --work-tint: #141E33;
  --attn: #F0B43C;
  --attn-tint: #2A2110;
  --attn-edge: #B8871F;
  --err: #FF7A6B;
  --err-tint: #2E1614;
  --mute: #B9A2FF;
  --mute-tint: #1F1A33;
  --voice: #ECEFF4;
  --on-signal: #0B0D10;
  --focus: #7FA8FF;
  --selection: #2A3C66;
  --shadow-drawer: 0 -8px 24px rgba(0, 0, 0, 0.5), 0 -1px 0 rgba(255, 255, 255, 0.04);
  --shadow-dial: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 0 rgba(0, 0, 0, 0.6), 0 8px 20px rgba(0, 0, 0, 0.45);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms;
    --dur-base: 0ms;
    --dur-slow: 0ms;
  }
}

/* ==== end tokens ==== */

/* ================= Board (presentation only) ================= */
html { background: #050608; }
body.board {
  margin: 0; padding: 40px 40px 56px;
  font-family: var(--font-ui); color: #C9CFD8;
  -webkit-font-smoothing: antialiased;
}
.board-head { max-width: 1400px; margin: 0 0 32px; }
.board-head h1 { font: 600 20px/1.2 var(--font-display); letter-spacing: -0.01em; color: #F2F4F7; margin: 0 0 6px; }
.board-head p { margin: 0; font-size: 13px; color: #8B94A3; max-width: 90ch; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; }
figure { margin: 0; }
figcaption { margin-top: 12px; width: 420px; font-size: 13px; line-height: 1.4; color: #8B94A3; }
figcaption b { display: block; color: #E4E8EE; font-weight: 600; font-size: 13px; margin-bottom: 2px; }
figcaption code { font: 12px var(--font-mono); color: #C9CFD8; }
.hero-only body.board, body.board.hero-only { padding: 0; }
body.hero-only .board-head, body.hero-only figcaption { display: none; }
body.hero-only .grid > figure:not(#hero) { display: none; }
body.hero-only .frame { border-radius: 0; box-shadow: none; outline: 0; }

/* ================= Window frame ================= */
.frame {
  width: 420px; height: 640px; position: relative; overflow: hidden;
  border-radius: 10px; outline: 1px solid #1E232B;
  box-shadow: 0 20px 50px rgba(0,0,0,.55);
  background: var(--bg); color: var(--fg);
  font: var(--weight-regular) var(--text-body)/var(--leading-body) var(--font-ui);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 0;
}
.frame.compact { width: 360px; height: 420px; }
.frame ::selection { background: var(--selection); }
.win { position: absolute; inset: 0; display: flex; flex-direction: column; }
.num { font-variant-numeric: tabular-nums; }

/* ================= Header ================= */
.hdr {
  display: flex; align-items: center; gap: var(--space-3);
  height: 52px; padding: 0 var(--space-2) 0 var(--gutter);
  border-bottom: 1px solid var(--line); flex: none;
}
.hdr-status { display: flex; align-items: center; gap: var(--space-2); font-weight: var(--weight-semibold); font-size: var(--text-small); white-space: nowrap; }
.hdr-status svg { width: 12px; height: 12px; flex: none; }
.hdr-status[data-s="live"] { color: var(--live); }
.hdr-status[data-s="muted"] { color: var(--mute); }
.hdr-status[data-s="attn"] { color: var(--attn); }
.hdr-status[data-s="err"] { color: var(--err); }
.hdr-status[data-s="neutral"] { color: var(--fg-2); }
.hdr-status small { font-weight: var(--weight-regular); color: var(--fg-2); font-size: var(--text-small); }
.hdr-meta { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-small); color: var(--fg-2); white-space: nowrap; overflow: hidden; }
.hdr-meta .proj { overflow: hidden; text-overflow: ellipsis; }
.hdr-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--fg-3); flex: none; }
.hdr-usage { font-size: var(--text-small); color: var(--fg-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ================= Buttons ================= */
button { font: inherit; color: inherit; }
.icon-btn {
  width: var(--hit-min); height: var(--hit-min); flex: none;
  display: grid; place-items: center;
  border: 0; background: transparent; color: var(--fg-2);
  border-radius: var(--radius-sm); cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--edge); }
.icon-btn svg { width: 20px; height: 20px; }
.btn {
  min-height: var(--hit-min); padding: 0 var(--space-4);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
  font-size: var(--text-body); font-weight: var(--weight-medium);
  background: var(--surface-1); border: 1px solid var(--edge); color: var(--fg);
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-instant) linear;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); min-height: 48px; font-weight: var(--weight-semibold); }
.btn.primary kbd { background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.btn.ghost-danger { background: transparent; border-color: transparent; color: var(--err); padding: 0 var(--space-3); }
.btn.ghost-danger:hover { background: var(--err-tint); }
.btn.text { background: transparent; border-color: transparent; color: var(--fg); padding: 0 var(--space-3); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--edge); }
.btn[disabled] { opacity: 1; color: var(--fg-3); border-style: dashed; cursor: not-allowed; }
.btn.block { width: 100%; }
kbd {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px;
  font: var(--weight-medium) 11px/1 var(--font-ui); letter-spacing: .02em;
  color: var(--fg-2); background: var(--surface-2);
  border: 1px solid var(--line); border-bottom-color: var(--edge); border-radius: var(--radius-xs);
}
.focus-demo { outline: var(--stroke-focus) solid var(--focus); outline-offset: 2px; }

/* ================= Stage + dial ================= */
.stage { flex: none; display: flex; flex-direction: column; align-items: center; padding: var(--space-5) var(--gutter) var(--space-3); }
.dial { position: relative; width: var(--dial-size); height: var(--dial-size); }
.dial svg.meter { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mute {
  position: absolute; left: 50%; top: 50%; width: var(--hit-primary); height: var(--hit-primary);
  margin: calc(var(--hit-primary) / -2) 0 0 calc(var(--hit-primary) / -2);
  border-radius: var(--radius-round); display: grid; place-items: center; cursor: pointer;
  background: var(--surface-2); color: var(--fg);
  border: 2px solid var(--edge); box-shadow: var(--shadow-dial);
  transition: background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
.mute svg { width: 30px; height: 30px; }
.dial[data-mode="listen"] .mute, .dial[data-mode="you"] .mute { border-color: var(--live); }
.dial[data-mode="voice"] .mute { border-color: var(--edge); }
.dial[data-mode="muted"] .mute, .dial[data-muted] .mute { background: var(--mute); border-color: var(--mute); color: var(--on-signal); }
.dial[data-mode="off"] .mute, .dial[data-mode="connect"] .mute { color: var(--fg-3); border-style: dashed; cursor: default; }
.mute-key { position: absolute; right: 2px; bottom: 6px; }

.floor { margin-top: var(--space-3); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.floor-word { display: flex; align-items: center; gap: var(--space-2); font: var(--weight-semibold) var(--text-state)/var(--leading-tight) var(--font-display); letter-spacing: var(--tracking-title); }
.floor-word svg { width: 18px; height: 18px; }
.floor-sub { font-size: var(--text-small); color: var(--fg-2); display: flex; align-items: center; gap: var(--space-2); }
.floor[data-tone="live"] .floor-word svg { color: var(--live); }
.floor[data-tone="muted"] .floor-word { color: var(--mute); }
.floor[data-tone="dim"] .floor-word { color: var(--fg-2); }

/* ================= Claude Code card ================= */
.cc {
  flex: none; margin: var(--space-2) var(--gutter) 0; padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md); background: var(--surface-1); border: 1px solid var(--line);
}
.cc-head { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-small); color: var(--fg-2); min-height: 20px; }
.cc-head .who { font-weight: var(--weight-semibold); color: var(--fg); }
.cc-head .state { display: inline-flex; align-items: center; gap: 6px; font-weight: var(--weight-semibold); }
.cc-head .state svg { width: 12px; height: 12px; }
.cc-head .t { margin-left: auto; font-variant-numeric: tabular-nums; }
.cc-step { margin: var(--space-2) 0 0; font-size: var(--text-body); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-step code { font: 13.5px var(--font-mono); color: var(--fg-2); }
.cc-req { margin-top: var(--space-2); display: flex; gap: var(--space-2); align-items: baseline; font-size: var(--text-small); color: var(--fg-2); }
.cc-req span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-req b { font-weight: var(--weight-medium); color: var(--fg-3); flex: none; }
.cc-sum { margin: var(--space-2) 0 0; font-size: var(--text-body); line-height: var(--leading-body); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cc-more { display: flex; justify-content: space-between; align-items: center; margin: var(--space-1) calc(var(--space-3) * -1) calc(var(--space-2) * -1) 0; }
.cc-more .cc-req { margin: 0; }
.cc[data-tone="idle"] { background: transparent; border-style: dashed; border-color: var(--line); padding-block: var(--space-2); }
.cc[data-tone="idle"] .cc-head { min-height: 28px; }
.cc[data-tone="work"] { border-color: color-mix(in srgb, var(--work) 45%, var(--line)); }
.cc[data-tone="work"] .state { color: var(--work); }
.cc[data-tone="done"] .state { color: var(--fg); }
.cc[data-tone="attn"] { background: var(--attn-tint); border: 2px solid var(--attn-edge); padding: var(--space-4); }
.cc[data-tone="attn"] .state { color: var(--attn); font-size: var(--text-body); }
.cc[data-tone="attn"] .state svg { width: 16px; height: 16px; }
.cc-cmd { margin: var(--space-3) 0 var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--surface-sunken); font: 13px/1.5 var(--font-mono); color: var(--fg); white-space: pre-wrap; word-break: break-all; }
.cc-note { margin: 0; font-size: var(--text-body); font-weight: var(--weight-medium); color: var(--fg); }
.cc-note span { color: var(--fg-2); font-weight: var(--weight-regular); }
.bar { height: 2px; background: var(--line); border-radius: 2px; margin-top: var(--space-3); overflow: hidden; }
.bar i { display: block; height: 100%; width: 38%; margin-left: 22%; background: var(--work); border-radius: 2px; }

/* ================= Captions ================= */
.caps { flex: 1; min-height: 0; margin: var(--space-3) 0 0; padding: 0 var(--gutter); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
  mask-image: linear-gradient(to bottom, transparent 0, #000 16px); }
.cap { margin: 0; padding-top: var(--space-2); }
.cap .who { display: block; font-size: var(--text-meta); font-weight: var(--weight-semibold); letter-spacing: .01em; color: var(--fg-3); margin-bottom: 1px; }
.cap .who.you { color: var(--fg-2); }
.cap p { margin: 0; font-size: var(--text-body); color: var(--fg-2); }
.cap.latest p { font-size: var(--text-lead); color: var(--fg); line-height: 1.4; }
.cap.live p::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -2px; background: var(--live); }
.caps-empty { color: var(--fg-3); font-size: var(--text-small); padding-bottom: var(--space-2); }

/* ================= Footer ================= */
.ftr { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--gap-group); padding: var(--space-3) var(--gutter) var(--space-3); border-top: 1px solid var(--line); margin-top: var(--space-3); }
.ftr .btn kbd { margin-left: 2px; }

/* ================= Banner ================= */
.banner { flex: none; display: flex; align-items: center; gap: var(--space-2); margin: var(--space-2) var(--gutter) 0; padding: 0 0 0 var(--space-3); min-height: 48px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--edge); font-size: var(--text-small); }
.banner svg.ico { width: 16px; height: 16px; flex: none; }
.banner p { margin: 0; flex: 1; line-height: 1.35; }
.banner[data-tone="err"] { background: var(--err-tint); border-color: color-mix(in srgb, var(--err) 60%, var(--edge)); }
.banner[data-tone="err"] svg.ico { color: var(--err); }
.banner[data-tone="warn"] { background: var(--attn-tint); border-color: var(--attn-edge); }
.banner[data-tone="warn"] svg.ico { color: var(--attn); }

/* ================= Overlay card (paused, errors, permission) ================= */
.sheet { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: var(--space-6) var(--gutter) 0; }
.sheet h2 { margin: 0 0 var(--space-2); font: var(--weight-semibold) var(--text-title)/1.15 var(--font-display); letter-spacing: var(--tracking-title); text-wrap: balance; }
.sheet > p { margin: 0 0 var(--space-4); color: var(--fg-2); max-width: 34ch; }
.sheet .head-row { display: flex; gap: var(--space-3); align-items: flex-start; }
.sheet .head-row svg { width: 26px; height: 26px; flex: none; margin-top: 2px; color: var(--fg-2); }
.sheet .head-row[data-tone="attn"] svg { color: var(--attn); }
.sheet .head-row[data-tone="err"] svg { color: var(--err); }
.sheet .head-row + p { padding-left: 38px; }
.sheet .glyph { width: 48px; height: 48px; border-radius: var(--radius-md); display: grid; place-items: center; margin-bottom: var(--space-4); background: var(--surface-2); border: 1px solid var(--edge); color: var(--fg); }
.sheet .glyph svg { width: 24px; height: 24px; }

.drawer { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface-1); border-top: 1px solid var(--edge); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-drawer); padding: var(--space-2) var(--gutter) var(--space-4); }

<script>
/* Mockup-only renderer for the dial. In the product, the same geometry is drawn
   once and tick lengths are set per animation frame from smoothed analyser levels. */
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const N = 48;
  function rnd(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
  function line(g, cx, r0, r1, a, cls, color, w) {
    const l = document.createElementNS(NS, "line");
    const c = Math.cos(a), s = Math.sin(a);
    l.setAttribute("x1", cx + c * r0); l.setAttribute("y1", cx + s * r0);
    l.setAttribute("x2", cx + c * r1); l.setAttribute("y2", cx + s * r1);
    l.setAttribute("stroke", color); l.setAttribute("stroke-width", w); l.setAttribute("stroke-linecap", "round");
    g.appendChild(l);
  }
  function arc(cx, r, a0, a1) {
    const p = (a) => [cx + Math.cos(a) * r, cx + Math.sin(a) * r];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`;
  }
  document.querySelectorAll(".dial").forEach((d) => {
    const size = d.getBoundingClientRect().width || 208;
    const k = size / 208;
    const cx = size / 2;
    const mode = d.dataset.mode;
    const lin = parseFloat(d.dataset.in || "0");
    const lout = parseFloat(d.dataset.out || "0");
    const R = rnd(parseInt(d.dataset.seed || "5", 10));
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "meter"); svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.setAttribute("aria-hidden", "true");
    const g = document.createElementNS(NS, "g"); svg.appendChild(g);

    // Bezel: hairline circle + 12 calibration marks
    const bez = document.createElementNS(NS, "circle");
    bez.setAttribute("cx", cx); bez.setAttribute("cy", cx); bez.setAttribute("r", cx - 2 * k);
    bez.setAttribute("fill", "none"); bez.setAttribute("stroke", "var(--line)"); bez.setAttribute("stroke-width", 1);
    g.appendChild(bez);
    for (let i = 0; i < 12; i++) line(g, cx, cx - 6 * k, cx - 2 * k, (i / 12) * Math.PI * 2 - Math.PI / 2, "", "var(--edge)", 1);

    const rIn0 = 58 * k, inMax = 20 * k, rOut0 = 82 * k, outMax = 14 * k;
    const tickW = Math.max(1.6, 2.2 * k);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      // Outer ring: Sotto's voice. Smooth, symmetric lobes.
      let lo = 3 * k, colOut = "var(--tick-rest)";
      if (mode === "voice" && lout > 0) {
        const lobe = 0.5 + 0.5 * Math.cos(a * 4 + 0.6);
        lo = 3 * k + outMax * lout * (0.25 + 0.75 * lobe);
        colOut = "var(--voice)";
      }
      line(g, cx, rOut0, rOut0 + lo, a, "", colOut, tickW);
      // Inner ring: your mic. Jagged, asymmetric.
      if (mode === "muted" || d.dataset.muted) continue;
      let li = 3.5 * k, colIn = "var(--tick-rest)";
      if (mode === "listen" || mode === "voice") { colIn = mode === "listen" ? "var(--live)" : "var(--tick-rest)"; li = 3.5 * k + inMax * lin * R(); }
      if (mode === "you") { colIn = "var(--live)"; li = 3.5 * k + inMax * lin * (0.15 + 0.85 * Math.pow(R(), 1.3)); }
      line(g, cx, rIn0, rIn0 + li, a, "", colIn, tickW);
    }
    if (mode === "muted" || d.dataset.muted) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", cx); c.setAttribute("cy", cx); c.setAttribute("r", rIn0 + 3 * k);
      c.setAttribute("fill", "none"); c.setAttribute("stroke", "var(--mute)"); c.setAttribute("stroke-width", 2);
      c.setAttribute("stroke-dasharray", "3 5"); c.setAttribute("stroke-linecap", "round");
      g.appendChild(c);
    }
    if (mode === "connect") {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", arc(cx, cx - 2 * k, -Math.PI / 2, -Math.PI / 2 + 1.1));
      p.setAttribute("fill", "none"); p.setAttribute("stroke", "var(--fg-2)"); p.setAttribute("stroke-width", 2.5); p.setAttribute("stroke-linecap", "round");
      g.appendChild(p);
    }
    if (d.dataset.work) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", arc(cx, cx - 2 * k, 0.35, 0.35 + 1.25));
      p.setAttribute("fill", "none"); p.setAttribute("stroke", "var(--work)"); p.setAttribute("stroke-width", 3); p.setAttribute("stroke-linecap", "round");
      g.appendChild(p);
    }
    d.prepend(svg);
  });
})();
</script>
